[project]
name = "hookrelay"
version = "0.1.0"
description = "Webhook 中继与可靠投递服务：接收即返回，可靠、幂等、可观测地异步投递事件"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "shenjiashuo" }]
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
# 这是一个应用而不是可发布的库，不需要构建后端
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "F",    # pyflakes
    "I",    # isort 导入排序
    "N",    # pep8-naming 命名规范
    "UP",   # pyupgrade 语法升级
    "B",    # flake8-bugbear 常见陷阱
    "ASYNC",# flake8-async 异步误用
    "C4",   # 推导式优化
    "SIM",  # 代码简化
    "RUF",  # ruff 专属规则
    "S",    # bandit 安全检查
]
ignore = [
    # 本项目注释与文档字符串使用中文，全角标点是正常写法
    # 这三条规则本意是防希腊字母等冒充 ASCII 字符，在中文语境下属于误报
    "RUF001",  # 全角标点（字符串）
    "RUF002",  # 全角标点（文档字符串）
    "RUF003",  # 全角标点（注释）
]

[tool.ruff.lint.isort]
# alembic 是第三方库，但项目根目录下也有一个 alembic/ 文件夹（迁移脚本的
# 固定位置），ruff 会误判成第一方包并给出错误的分组建议。这里显式声明。
known-third-party = ["alembic"]


[tool.ruff.lint.per-file-ignores]
# 测试文件允许使用 assert 与硬编码测试数据
# S311 是因为测试里用了固定种子的 random.Random 来验证抖动的随机性
"tests/*" = ["S101", "S105", "S106", "S311"]
# 验收脚本与辅助脚本同样放宽：假密码、假密钥、print 输出都是必要的
"scripts/*" = ["S101", "S105", "S106", "T201"]
"alembic/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 所有 async fixture 共用同一个事件循环。默认值在 pytest-asyncio 1.x 里
# 会告警，而且 session 级别的连接池必须在同一个循环里创建和释放
asyncio_default_fixture_loop_scope = "session"
# 测试函数也必须用同一个循环。asyncpg 的连接绑定在创建它的循环上，
# 若 fixture 在 session loop 里建好了连接池、测试却跑在另一个 function loop，
# 驱动会报 "got result for unknown protocol state"这类底层错误
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
core = "sysmon"
# 必须用 PEP 669 的 sysmon 核心。
#
# 默认的 C 追踪器（ctrace）在每次 await 进入 asyncpg 的 C 扩展后
# 会丢失当前帧的追踪，后果是：函数明明跑完了，coverage 却认为它只执行到
# 第一个 await 就停住。实测同一套测试下 app/api/ingest.py 会显示
# 53%（实际 93%），且记录的行号能超出文件长度（出现 1165 这类不存在的行）。
#
# sysmon 绕过 sys.settrace，在 C 扩展前后都能正确记录，需要 Python 3.12+，
# 与本项目要求一致。

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
